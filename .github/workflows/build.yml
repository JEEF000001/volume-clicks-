name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/volumeautoclick app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VolumeAutoClick"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.volumeautoclick'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.volumeautoclick'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Volume Auto Click">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ClickService"
                      android:exported="true"
                      android:label="Volume Auto Click"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/service_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:canPerformGestures="true"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/service_desc"/>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="service_desc">Press a volume button to tap where the circle is.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/example/volumeautoclick/MainActivity.kt << 'EOF'
          package com.example.volumeautoclick

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  finish()
              }
          }
          EOF

          cat > app/src/main/java/com/example/volumeautoclick/ClickService.kt << 'EOF'
          package com.example.volumeautoclick

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.*
          import android.view.accessibility.AccessibilityEvent

          class ClickService : AccessibilityService() {

              private lateinit var wm: WindowManager
              private lateinit var circle: View
              private lateinit var lp: WindowManager.LayoutParams
              private lateinit var shape: GradientDrawable
              private val handler = Handler(Looper.getMainLooper())
              private val size = 140

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  shape = GradientDrawable().apply {
                      this.shape = GradientDrawable.OVAL
                      setColor(Color.argb(90, 255, 0, 0))
                      setStroke(6, Color.RED)
                  }
                  circle = View(this).apply { background = shape }

                  lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 400
                      y = 800
                  }

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  circle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = lp.x
                              startY = lp.y
                              touchX = e.rawX
                              touchY = e.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = startX + (e.rawX - touchX).toInt()
                              lp.y = startY + (e.rawY - touchY).toInt()
                              wm.updateViewLayout(circle, lp)
                          }
                      }
                      true
                  }
                  wm.addView(circle, lp)
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_VOLUME_UP ||
                      event.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      if (event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0) {
                          tapCircle()
                      }
                      return true
                  }
                  return false
              }

              private fun tapCircle() {
                  val loc = IntArray(2)
                  circle.getLocationOnScreen(loc)
                  val cx = loc[0] + size / 2f
                  val cy = loc[1] + size / 2f

                  // Turn green (key detected) and let touches pass through the circle
                  shape.setColor(Color.argb(160, 0, 255, 0))
                  lp.flags = lp.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  wm.updateViewLayout(circle, lp)

                  // Wait a moment so the circle is really see-through, then tap
                  handler.postDelayed({
                      val path = Path().apply { moveTo(cx, cy) }
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                          .build()
                      val sent = dispatchGesture(gesture, object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) = restore()
                          override fun onCancelled(g: GestureDescription?) = restore()
                      }, null)
                      if (!sent) restore()
                  }, 150)

                  // Safety: always restore the circle after 1 second
                  handler.postDelayed({ restore() }, 1000)
              }

              private fun restore() {
                  shape.setColor(Color.argb(90, 255, 0, 0))
                  lp.flags = lp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  try { wm.updateViewLayout(circle, lp) } catch (e: Exception) {}
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() {
                  wm.removeView(circle)
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeAutoClick-apk
          path: app/build/outputs/apk/debug/app-debug.apk
